server:
  port: 8080

spring:
  application:
    name: upi-safeguard-core
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:upi_safeguard;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false

risk:
  service:
    base-url: ${AI_SERVICE_URL:http://localhost:8001}
    timeout-ms: ${AI_SERVICE_TIMEOUT_MS:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
