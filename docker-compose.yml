services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - EXPOSE_DEMO_OTP=true
      - JWT_SECRET_KEY=default_demo_secret_key_change_in_production
      - ADMIN_DEFAULT_PASSWORD=admin_secret_pass
      - RATE_LIMIT_PER_MINUTE=100
      - USE_REMOTE_RISK_SERVICE=true
      - AI_SERVICE_URL=http://ai-service:8001
      - DEMO_AI_FALLBACK=true
      # Persist SQLite inside a dedicated volume so user accounts survive rebuilds
      - POSTGRES_URL=sqlite+aiosqlite:////app/persist/demo_database.db
    volumes:
      - sqlite-data:/app/persist
      - backend-ml:/app/app/ml/trained_models
    depends_on:
      - ai-service

  ai-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn ai_service.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      - APP_ENV=production
    volumes:
      - backend-ml:/app/app/ml/trained_models

  core-backend:
    build:
      context: ./core-backend
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      - AI_SERVICE_URL=http://ai-service:8001
      - AI_SERVICE_TIMEOUT_MS=3000
      - DATABASE_URL=jdbc:postgresql://postgres:5432/upi_safeguard
      - DATABASE_USERNAME=upi_safeguard
      - DATABASE_PASSWORD=upi_safeguard_dev
      - JPA_DDL_AUTO=update
      - APP_EXPOSE_DEMO_OTP=true
      # Redis-backed coordination: rate limiting + intervention state across replicas
      - APP_CACHE_DRIVER=redis
      - REDIS_HOST=redis
      # Event streaming: transaction/fraud/intervention events → notification fanout
      - APP_KAFKA_ENABLED=true
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - ai-service
      - postgres
      - redis
      - kafka

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      # Single-node KRaft cluster (no ZooKeeper) for local development
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - kafka-data:/var/lib/kafka/data

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=upi_safeguard
      - POSTGRES_USER=upi_safeguard
      - POSTGRES_PASSWORD=upi_safeguard_dev
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production

volumes:
  backend-data:
  sqlite-data:
  backend-ml:
  postgres-data:
  redis-data:
  kafka-data:
