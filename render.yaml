# Render Blueprint — UPI SafeGuard Backend
# https://docs.render.com/blueprint-spec

services:
  - type: web
    name: upi-safeguard-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_DEFAULT_PASSWORD
        value: "admin123"
      - key: ENVIRONMENT
        value: "production"
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: '["https://upi-safeguard.vercel.app","http://localhost:3000","http://localhost:5173"]'
      - key: RATE_LIMIT_PER_MINUTE
        value: "100"
